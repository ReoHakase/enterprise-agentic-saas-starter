name: Deploy production

on:
  workflow_dispatch:
    inputs:
      force_agent_protocol_bootstrap:
        description: One-time bootstrap for an existing pre-Mastra Agent protocol
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NODE_ENV: production
      APP_NAME: ${{ vars.APP_NAME }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
      VITE_API_BASE_URL: ${{ vars.API_PUBLIC_URL }}
      AGENT_ASSET_UPLOAD_ENABLED: ${{ vars.AGENT_ASSET_UPLOAD_ENABLED }}
      AGENT_RUNS_ENABLED: ${{ vars.AGENT_RUNS_ENABLED }}
      AGENT_VISION_ENABLED: ${{ vars.AGENT_VISION_ENABLED }}
      AGENT_WRITES_ENABLED: ${{ vars.AGENT_WRITES_ENABLED }}
      BETTER_AUTH_URL: ${{ vars.API_PUBLIC_URL }}
      AUTH_COOKIE_DOMAIN: ${{ vars.AUTH_COOKIE_DOMAIN }}
      TRUSTED_ORIGINS: ${{ vars.APP_BASE_URL }}
      CORS_ORIGIN: ${{ vars.APP_BASE_URL }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      API_WORKER_NAME: enterprise-agentic-saas-api
      AGENT_WORKER_NAME: enterprise-agentic-saas-agent

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production configuration
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MASTRA_STORAGE_AUTH_TOKEN: ${{ secrets.MASTRA_STORAGE_AUTH_TOKEN }}
          MASTRA_STORAGE_URL: ${{ secrets.MASTRA_STORAGE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          bun - <<'JS'
          import { appendFile } from "node:fs/promises"
          import { isIP } from "node:net"

          const requireValue = (name) => {
            const value = process.env[name]
            if (!value) throw new Error(`${name} is required`)
            return value
          }
          const hostnamePattern =
            /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/
          const exactProductionOrigin = (name) => {
            const value = requireValue(name)
            let url
            try {
              url = new URL(value)
            } catch {
              throw new Error(`${name} must be an exact HTTPS custom-domain origin`)
            }
            if (
              url.protocol !== "https:" ||
              url.origin !== value ||
              !hostnamePattern.test(url.hostname) ||
              isIP(url.hostname) !== 0
            ) {
              throw new Error(`${name} must be an exact HTTPS custom-domain origin`)
            }
            if (
              url.hostname === "workers.dev" ||
              url.hostname.endsWith(".workers.dev")
            ) {
              throw new Error(`${name} must use a production custom domain`)
            }
            return url.hostname
          }

          requireValue("APP_NAME")
          const hosts = {
            APP_HOST: exactProductionOrigin("APP_BASE_URL"),
            API_HOST: exactProductionOrigin("API_PUBLIC_URL"),
          }
          if (new Set(Object.values(hosts)).size !== 2) {
            throw new Error("Public Worker origins must use distinct hostnames")
          }

          const cookieDomain = requireValue("AUTH_COOKIE_DOMAIN")
          if (!hostnamePattern.test(cookieDomain)) {
            throw new Error(
              "AUTH_COOKIE_DOMAIN must be the lowercase application parent domain"
            )
          }
          for (const host of Object.values(hosts)) {
            if (host !== cookieDomain && !host.endsWith(`.${cookieDomain}`)) {
              throw new Error("Public Worker origins must share AUTH_COOKIE_DOMAIN")
            }
          }

          for (const name of [
            "AGENT_ASSET_UPLOAD_ENABLED",
            "AGENT_RUNS_ENABLED",
            "AGENT_VISION_ENABLED",
            "AGENT_WRITES_ENABLED",
          ]) {
            if (!["0", "1"].includes(requireValue(name))) {
              throw new Error(`${name} must be exactly 0 or 1`)
            }
          }
          for (const name of [
            "BETTER_AUTH_SECRET",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "EMAIL_FROM",
            "GITHUB_CLIENT_ID",
            "GITHUB_CLIENT_SECRET",
            "OPENROUTER_API_KEY",
            "MASTRA_STORAGE_AUTH_TOKEN",
            "MASTRA_STORAGE_URL",
            "TURSO_AUTH_TOKEN",
            "TURSO_DATABASE_URL",
          ]) {
            requireValue(name)
          }
          const applicationDatabaseUrl = requireValue("TURSO_DATABASE_URL")
            .trim()
            .replace(/\/+$/, "")
          const agentDatabaseUrl = requireValue("MASTRA_STORAGE_URL")
            .trim()
            .replace(/\/+$/, "")
          if (
            applicationDatabaseUrl === agentDatabaseUrl ||
            requireValue("TURSO_AUTH_TOKEN") ===
              requireValue("MASTRA_STORAGE_AUTH_TOKEN")
          ) {
            throw new Error(
              "Application and Agent databases must use distinct URLs and credentials"
            )
          }
          if (
            !agentDatabaseUrl.startsWith("libsql://") &&
            !agentDatabaseUrl.startsWith("https://")
          ) {
            throw new Error("MASTRA_STORAGE_URL must be a remote libSQL URL")
          }
          if (requireValue("EMAIL_PROVIDER") !== "cloudflare") {
            throw new Error("EMAIL_PROVIDER must be cloudflare")
          }
          await appendFile(
            requireValue("GITHUB_ENV"),
            Object.entries(hosts)
              .map(([name, host]) => `${name}=${host}\n`)
              .join("")
          )
          JS

      - name: Verify Cloudflare binding types
        run: |
          bun run --cwd apps/api cf:typegen
          bun run --cwd apps/images cf:typegen
          bun run --cwd apps/agent cf:typegen
          apps/web/node_modules/.bin/wrangler types \
            --config apps/web/wrangler.jsonc \
            --env-interface CloudflareEnv \
            --include-runtime=false \
            "$RUNNER_TEMP/web-cloudflare-env.d.ts"
          git diff --exit-code -- \
            apps/api/src/cloudflare-env.d.ts \
            apps/images/src/cloudflare-env.d.ts \
            apps/agent/src/cloudflare-env.d.ts
          test -s "$RUNNER_TEMP/web-cloudflare-env.d.ts"

      - name: Build private Images Worker
        run: bun run --cwd apps/images build:cloudflare

      - name: Deploy private Images Worker before API bindings
        run: bun run --cwd apps/images deploy -- --strict
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Detect mutual Service Binding bootstrap state
        id: worker-state
        run: |
          bootstrap_required="${{ inputs.force_agent_protocol_bootstrap }}"
          for worker_kind in api agent; do
            if [ "$worker_kind" = "api" ]; then
              worker_name="$API_WORKER_NAME"
            else
              worker_name="$AGENT_WORKER_NAME"
            fi
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 30 \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name")"
            case "$status" in
              200) worker_exists=true ;;
              404)
                worker_exists=false
                bootstrap_required=true
                ;;
              *)
                printf 'Cloudflare Worker state lookup failed with HTTP %s\n' \
                  "$status" >&2
                exit 1
                ;;
            esac
            printf '%s_exists=%s\n' "$worker_kind" "$worker_exists" \
              >> "$GITHUB_OUTPUT"
          done
          printf 'bootstrap_required=%s\n' "$bootstrap_required" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build API Worker
        run: bun run --cwd apps/api build:cloudflare

      - name: Inspect cross-database Worker secret inventory
        id: worker-secrets
        run: |
          stale_found=false
          for worker_kind in api agent; do
            if [ "$worker_kind" = "api" ]; then
              worker_name="$API_WORKER_NAME"
              worker_exists="${{ steps.worker-state.outputs.api_exists }}"
            else
              worker_name="$AGENT_WORKER_NAME"
              worker_exists="${{ steps.worker-state.outputs.agent_exists }}"
            fi
            inventory="$RUNNER_TEMP/initial-$worker_kind-worker-secrets.json"
            inventory_status="$(curl --silent --show-error --max-time 30 \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/secrets" \
              --output "$inventory")"
            missing_allowed="$(
              bun run .github/compatibility-rollout-policy.ts \
                inventory-missing-allowed "$worker_exists" "$inventory_status"
            )"
            if [ "$missing_allowed" = "true" ]; then
              printf '{"success":true,"result":[]}\n' > "$inventory"
              continue
            fi
            if [ "$inventory_status" != "200" ]; then
              printf '%s Worker secret inventory failed with HTTP %s\n' \
                "$worker_kind" "$inventory_status" >&2
              exit 1
            fi
            if [ -n "$(bun run .github/worker-secret-policy.ts stale "$worker_kind" "$inventory")" ]; then
              stale_found=true
            fi
          done
          printf 'stale_found=%s\n' "$stale_found" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Determine compatibility rollout requirement
        id: compatibility-state
        run: |
          compatibility_required="$(
            bun run .github/compatibility-rollout-policy.ts \
              "${{ steps.worker-state.outputs.bootstrap_required }}" \
              "${{ steps.worker-secrets.outputs.stale_found }}"
          )"
          printf 'compatibility_required=%s\n' "$compatibility_required" >> "$GITHUB_OUTPUT"

      - name: Engage Agent kill switch before compatibility drain
        if: steps.compatibility-state.outputs.compatibility_required == 'true'
        run: |
          for name in \
            AGENT_ASSET_UPLOAD_ENABLED \
            AGENT_RUNS_ENABLED \
            AGENT_VISION_ENABLED \
            AGENT_WRITES_ENABLED; do
            if [ "${!name}" != "0" ]; then
              printf '%s must be 0 during a compatibility rollout\n' \
                "$name" >&2
              exit 1
            fi
          done

      - name: Deploy compatible API Worker before migration
        if: steps.compatibility-state.outputs.compatibility_required == 'true'
        run: |
          umask 077
          api_secrets="$(mktemp)"
          trap 'rm -f "$api_secrets"' EXIT
          SECRETS_FILE="$api_secrets" bun -e '
            const keys = [
              "BETTER_AUTH_SECRET",
              "GITHUB_CLIENT_ID",
              "GITHUB_CLIENT_SECRET",
              "TURSO_AUTH_TOKEN",
              "TURSO_DATABASE_URL",
            ]
            await Bun.write(
              process.env.SECRETS_FILE,
              JSON.stringify(Object.fromEntries(keys.map((key) => [key, process.env[key]])))
            )
          '
          apps/api/node_modules/.bin/wrangler deploy \
            apps/api/dist/worker/worker.js \
            --config apps/api/wrangler.bootstrap.jsonc \
            --no-bundle \
            --var "AGENT_ASSET_UPLOAD_ENABLED:$AGENT_ASSET_UPLOAD_ENABLED" \
            --var "AGENT_MAINTENANCE_MODE:1" \
            --domain "$API_HOST" \
            --strict \
            --secrets-file "$api_secrets"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Smoke compatible API Worker before migration
        if: steps.compatibility-state.outputs.compatibility_required == 'true'
        run: |
          assert_status() {
            label="$1"
            expected="$2"
            url="$3"
            status=""
            for delay in 0 2 4 8 12; do
              sleep "$delay"
              status="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$status" = "$expected" ]; then
                printf '%s smoke passed\n' "$label"
                return 0
              fi
            done
            printf '%s smoke failed with HTTP %s\n' "$label" "$status" >&2
            return 1
          }
          assert_status API-compat-health 200 "$API_PUBLIC_URL/health"
          assert_status API-compat-ready 200 "$API_PUBLIC_URL/ready"
          assert_status API-compat-OpenAPI 200 "$API_PUBLIC_URL/openapi/json"
          assert_status API-compat-Agent-maintenance 503 "$API_PUBLIC_URL/agent/threads"
          assert_status API-compat-Agent-assets-maintenance 503 \
            "$API_PUBLIC_URL/files/organizations/maintenance/agent-assets/maintenance"

      - name: Verify compatibility API has no Agent runtime binding
        if: steps.compatibility-state.outputs.compatibility_required == 'true'
        run: |
          settings="$(mktemp)"
          trap 'rm -f "$settings"' EXIT
          curl --fail --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$API_WORKER_NAME/settings" \
            --output "$settings"
          bun run .github/worker-binding-policy.ts compatibility "$settings"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Drain live Agent capabilities before migration
        if: steps.compatibility-state.outputs.compatibility_required == 'true'
        run: bun run packages/db/src/agent-rollout-drain.ts
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Delete forbidden cross-database Worker secrets and verify inventory
        run: |
          for worker_kind in api agent; do
            if [ "$worker_kind" = "api" ]; then
              worker_name="$API_WORKER_NAME"
              worker_exists=true
            else
              worker_name="$AGENT_WORKER_NAME"
              worker_exists="${{ steps.worker-state.outputs.agent_exists }}"
            fi
            inventory="$(mktemp)"
            trap 'rm -f "$inventory"' EXIT
            inventory_status="$(curl --silent --show-error --max-time 30 \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/secrets" \
              --output "$inventory")"
            missing_allowed="$(
              bun run .github/compatibility-rollout-policy.ts \
                inventory-missing-allowed "$worker_exists" "$inventory_status"
            )"
            if [ "$missing_allowed" = "true" ]; then
              rm -f "$inventory"
              trap - EXIT
              continue
            fi
            if [ "$inventory_status" != "200" ]; then
              printf '%s Worker secret inventory failed with HTTP %s\n' \
                "$worker_kind" "$inventory_status" >&2
              exit 1
            fi
            bun run .github/worker-secret-policy.ts assert-no-new \
              "$worker_kind" \
              "$RUNNER_TEMP/initial-$worker_kind-worker-secrets.json" \
              "$inventory"
            stale_secrets="$(
              bun run .github/worker-secret-policy.ts stale \
                "$worker_kind" "$inventory"
            )"
            while IFS= read -r secret_name; do
              [ -z "$secret_name" ] && continue
              curl --fail --silent --show-error --max-time 30 \
                --request DELETE \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/secrets/$secret_name" \
                --output /dev/null
            done <<< "$stale_secrets"
            curl --fail --silent --show-error --max-time 30 \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/secrets" \
              --output "$inventory"
            bun run .github/worker-secret-policy.ts assert "$worker_kind" "$inventory"
            rm -f "$inventory"
            trap - EXIT
          done
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Reverify all Worker secret inventories before migration
        run: |
          for worker_kind in api agent; do
            if [ "$worker_kind" = "api" ]; then
              worker_name="$API_WORKER_NAME"
              worker_exists=true
            else
              worker_name="$AGENT_WORKER_NAME"
              worker_exists="${{ steps.worker-state.outputs.agent_exists }}"
            fi
            inventory="$(mktemp)"
            trap 'rm -f "$inventory"' EXIT
            inventory_status="$(curl --silent --show-error --max-time 30 \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/secrets" \
              --output "$inventory")"
            missing_allowed="$(
              bun run .github/compatibility-rollout-policy.ts \
                inventory-missing-allowed "$worker_exists" "$inventory_status"
            )"
            if [ "$missing_allowed" = "true" ]; then
              rm -f "$inventory"
              trap - EXIT
              continue
            fi
            if [ "$inventory_status" != "200" ]; then
              printf '%s Worker final secret inventory failed with HTTP %s\n' \
                "$worker_kind" "$inventory_status" >&2
              exit 1
            fi
            bun run .github/worker-secret-policy.ts assert-no-new \
              "$worker_kind" \
              "$RUNNER_TEMP/initial-$worker_kind-worker-secrets.json" \
              "$inventory"
            bun run .github/worker-secret-policy.ts assert \
              "$worker_kind" "$inventory"
            rm -f "$inventory"
            trap - EXIT
          done
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply Turso migrations
        run: bun run --cwd packages/db db:migrate
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Build Agent Worker
        run: bun run --cwd apps/agent build:cloudflare

      - name: Deploy Agent Worker
        run: |
          umask 077
          agent_secrets="$(mktemp)"
          trap 'rm -f "$agent_secrets"' EXIT
          SECRETS_FILE="$agent_secrets" bun -e '
            const keys = [
              "MASTRA_STORAGE_AUTH_TOKEN",
              "MASTRA_STORAGE_URL",
              "OPENROUTER_API_KEY",
            ]
            await Bun.write(
              process.env.SECRETS_FILE,
              JSON.stringify(Object.fromEntries(keys.map((key) => [key, process.env[key]])))
            )
          '
          bun run --cwd apps/agent deploy -- \
            ./dist/worker/worker.js \
            --no-bundle \
            --var "AGENT_RUNS_ENABLED:$AGENT_RUNS_ENABLED" \
            --var "AGENT_VISION_ENABLED:$AGENT_VISION_ENABLED" \
            --var "AGENT_WRITES_ENABLED:$AGENT_WRITES_ENABLED" \
            --var "NODE_ENV:production" \
            --strict \
            --secrets-file "$agent_secrets"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MASTRA_STORAGE_AUTH_TOKEN: ${{ secrets.MASTRA_STORAGE_AUTH_TOKEN }}
          MASTRA_STORAGE_URL: ${{ secrets.MASTRA_STORAGE_URL }}

      - name: Deploy final API Worker
        run: |
          umask 077
          api_secrets="$(mktemp)"
          trap 'rm -f "$api_secrets"' EXIT
          SECRETS_FILE="$api_secrets" bun -e '
            const keys = [
              "BETTER_AUTH_SECRET",
              "GITHUB_CLIENT_ID",
              "GITHUB_CLIENT_SECRET",
              "TURSO_AUTH_TOKEN",
              "TURSO_DATABASE_URL",
            ]
            await Bun.write(
              process.env.SECRETS_FILE,
              JSON.stringify(Object.fromEntries(keys.map((key) => [key, process.env[key]])))
            )
          '
          apps/api/node_modules/.bin/wrangler deploy \
            apps/api/dist/worker/worker.js \
            --config apps/api/wrangler.jsonc \
            --no-bundle \
            --var "AGENT_ASSET_UPLOAD_ENABLED:$AGENT_ASSET_UPLOAD_ENABLED" \
            --var "AGENT_MAINTENANCE_MODE:0" \
            --domain "$API_HOST" \
            --strict \
            --secrets-file "$api_secrets"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Smoke API Worker
        run: |
          assert_status() {
            label="$1"
            expected="$2"
            url="$3"
            status=""
            for delay in 0 2 4 8 12; do
              sleep "$delay"
              status="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$status" = "$expected" ]; then
                printf '%s smoke passed\n' "$label"
                return 0
              fi
            done
            printf '%s smoke failed with HTTP %s\n' "$label" "$status" >&2
            return 1
          }
          assert_status API-health 200 "$API_PUBLIC_URL/health"
          assert_status API-ready 200 "$API_PUBLIC_URL/ready"
          assert_status API-OpenAPI 200 "$API_PUBLIC_URL/openapi/json"

      - name: Verify final API Agent bindings
        run: |
          settings="$(mktemp)"
          trap 'rm -f "$settings"' EXIT
          curl --fail --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$API_WORKER_NAME/settings" \
            --output "$settings"
          bun run .github/worker-binding-policy.ts final "$settings"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build Web Worker
        run: bun run --cwd apps/web build:cloudflare

      - name: Deploy Web Worker
        run: bun run --cwd apps/web deploy -- --domain "$APP_HOST" --strict
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke Web Worker
        run: |
          assert_status() {
            label="$1"
            expected="$2"
            url="$3"
            status=""
            for delay in 0 2 4 8 12; do
              sleep "$delay"
              status="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$status" = "$expected" ]; then
                printf '%s smoke passed\n' "$label"
                return 0
              fi
            done
            printf '%s smoke failed with HTTP %s\n' "$label" "$status" >&2
            return 1
          }
          assert_status Web-sign-in 200 "$APP_BASE_URL/auth/sign-in"
