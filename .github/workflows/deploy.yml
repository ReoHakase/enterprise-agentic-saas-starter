name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NODE_ENV: production
      APP_NAME: ${{ vars.APP_NAME }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_PUBLIC_URL }}
      BETTER_AUTH_URL: ${{ vars.API_PUBLIC_URL }}
      AUTH_COOKIE_DOMAIN: ${{ vars.AUTH_COOKIE_DOMAIN }}
      TRUSTED_ORIGINS: ${{ vars.APP_BASE_URL }}
      CORS_ORIGIN: ${{ vars.APP_BASE_URL }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      SENTRY_ENVIRONMENT: production
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_API_DSN: ${{ secrets.SENTRY_API_DSN }}
      SENTRY_WEB_DSN: ${{ secrets.SENTRY_WEB_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_WEB_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_API_PROJECT: ${{ vars.SENTRY_API_PROJECT }}
      SENTRY_WEB_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
      SENTRY_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production configuration
        run: |
          test -n "$APP_BASE_URL"
          test -n "$API_PUBLIC_URL"
          test -n "$AUTH_COOKIE_DOMAIN"
          test -n "$EMAIL_FROM"
          test -n "$SENTRY_API_DSN"
          test -n "$SENTRY_WEB_DSN"
          test -n "$NEXT_PUBLIC_SENTRY_DSN"
          test -n "$SENTRY_AUTH_TOKEN"
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_API_PROJECT"
          test -n "$SENTRY_WEB_PROJECT"
          test -n "$TURSO_DATABASE_URL"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Apply Turso migrations
        run: bun run --cwd packages/db db:migrate

      - name: Deploy API Worker
        run: bun run --cwd apps/api deploy
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_API_DSN }}
          SENTRY_PROJECT: ${{ env.SENTRY_API_PROJECT }}

      - name: Deploy Web Worker
        run: bun run --cwd apps/web deploy
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_WEB_DSN }}
          SENTRY_PROJECT: ${{ env.SENTRY_WEB_PROJECT }}
