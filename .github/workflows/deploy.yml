name: Deploy production

on:
  workflow_dispatch:
    inputs:
      force_agent_protocol_bootstrap:
        description: One-time bootstrap for an existing pre-Mastra Agent protocol
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NODE_ENV: production
      APP_NAME: ${{ vars.APP_NAME }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_PUBLIC_URL }}
      AGENT_ASSET_UPLOAD_ENABLED: ${{ vars.AGENT_ASSET_UPLOAD_ENABLED }}
      AGENT_RUNS_ENABLED: ${{ vars.AGENT_RUNS_ENABLED }}
      AGENT_VISION_ENABLED: ${{ vars.AGENT_VISION_ENABLED }}
      AGENT_WRITES_ENABLED: ${{ vars.AGENT_WRITES_ENABLED }}
      BETTER_AUTH_URL: ${{ vars.API_PUBLIC_URL }}
      AUTH_COOKIE_DOMAIN: ${{ vars.AUTH_COOKIE_DOMAIN }}
      TRUSTED_ORIGINS: ${{ vars.APP_BASE_URL }}
      CORS_ORIGIN: ${{ vars.APP_BASE_URL }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      SENTRY_ENVIRONMENT: production
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_API_PROJECT: ${{ vars.SENTRY_API_PROJECT }}
      SENTRY_AGENT_PROJECT: ${{ vars.SENTRY_AGENT_PROJECT }}
      SENTRY_WEB_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
      API_WORKER_NAME: enterprise-agentic-saas-api
      AGENT_WORKER_NAME: enterprise-agentic-saas-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production configuration
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENTRY_AGENT_DSN: ${{ secrets.SENTRY_AGENT_DSN }}
          SENTRY_API_DSN: ${{ secrets.SENTRY_API_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_WEB_DSN: ${{ secrets.SENTRY_WEB_DSN }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          bun - <<'JS'
          import { appendFile } from "node:fs/promises"
          import { isIP } from "node:net"

          const requireValue = (name) => {
            const value = process.env[name]
            if (!value) throw new Error(`${name} is required`)
            return value
          }
          const hostnamePattern =
            /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/
          const exactProductionOrigin = (name) => {
            const value = requireValue(name)
            let url
            try {
              url = new URL(value)
            } catch {
              throw new Error(`${name} must be an exact HTTPS custom-domain origin`)
            }
            if (
              url.protocol !== "https:" ||
              url.origin !== value ||
              !hostnamePattern.test(url.hostname) ||
              isIP(url.hostname) !== 0
            ) {
              throw new Error(`${name} must be an exact HTTPS custom-domain origin`)
            }
            if (
              url.hostname === "workers.dev" ||
              url.hostname.endsWith(".workers.dev")
            ) {
              throw new Error(`${name} must use a production custom domain`)
            }
            return url.hostname
          }

          requireValue("APP_NAME")
          const hosts = {
            APP_HOST: exactProductionOrigin("APP_BASE_URL"),
            API_HOST: exactProductionOrigin("API_PUBLIC_URL"),
          }
          if (new Set(Object.values(hosts)).size !== 2) {
            throw new Error("Public Worker origins must use distinct hostnames")
          }

          const cookieDomain = requireValue("AUTH_COOKIE_DOMAIN")
          if (!hostnamePattern.test(cookieDomain)) {
            throw new Error(
              "AUTH_COOKIE_DOMAIN must be the lowercase application parent domain"
            )
          }
          for (const host of Object.values(hosts)) {
            if (host !== cookieDomain && !host.endsWith(`.${cookieDomain}`)) {
              throw new Error("Public Worker origins must share AUTH_COOKIE_DOMAIN")
            }
          }

          for (const name of [
            "AGENT_ASSET_UPLOAD_ENABLED",
            "AGENT_RUNS_ENABLED",
            "AGENT_VISION_ENABLED",
            "AGENT_WRITES_ENABLED",
          ]) {
            if (!["0", "1"].includes(requireValue(name))) {
              throw new Error(`${name} must be exactly 0 or 1`)
            }
          }
          for (const name of [
            "BETTER_AUTH_SECRET",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "EMAIL_FROM",
            "GITHUB_CLIENT_ID",
            "GITHUB_CLIENT_SECRET",
            "OPENROUTER_API_KEY",
            "SENTRY_AGENT_DSN",
            "SENTRY_API_DSN",
            "SENTRY_AUTH_TOKEN",
            "SENTRY_ORG",
            "SENTRY_AGENT_PROJECT",
            "SENTRY_API_PROJECT",
            "SENTRY_WEB_DSN",
            "SENTRY_WEB_PROJECT",
            "TURSO_AUTH_TOKEN",
            "TURSO_DATABASE_URL",
          ]) {
            requireValue(name)
          }
          if (requireValue("EMAIL_PROVIDER") !== "cloudflare") {
            throw new Error("EMAIL_PROVIDER must be cloudflare")
          }
          await appendFile(
            requireValue("GITHUB_ENV"),
            Object.entries(hosts)
              .map(([name, host]) => `${name}=${host}\n`)
              .join("")
          )
          JS

      - name: Verify Cloudflare binding types
        run: |
          bun run --cwd apps/api cf:typegen
          bun run --cwd apps/agent cf:typegen
          apps/web/node_modules/.bin/wrangler types \
            --config apps/web/wrangler.jsonc \
            --env-interface CloudflareEnv \
            --include-runtime=false \
            "$RUNNER_TEMP/web-cloudflare-env.d.ts"
          git diff --exit-code -- \
            apps/api/src/cloudflare-env.d.ts \
            apps/agent/src/cloudflare-env.d.ts
          test -s "$RUNNER_TEMP/web-cloudflare-env.d.ts"

      - name: Detect mutual Service Binding bootstrap state
        id: worker-state
        run: |
          bootstrap_required="${{ inputs.force_agent_protocol_bootstrap }}"
          for worker_name in "$API_WORKER_NAME" "$AGENT_WORKER_NAME"; do
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 30 \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name")"
            case "$status" in
              200) ;;
              404) bootstrap_required=true ;;
              *)
                printf 'Cloudflare Worker state lookup failed with HTTP %s\n' \
                  "$status" >&2
                exit 1
                ;;
            esac
          done
          printf 'bootstrap_required=%s\n' "$bootstrap_required" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build API Worker and upload source maps
        run: |
          bun run --cwd apps/api build:cloudflare
          bun run --cwd apps/api sentry:sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ env.SENTRY_API_PROJECT }}

      - name: Inspect file activity rollout state
        id: file-activity-rollout
        run: bun run packages/db/src/file-activity-rollout.ts >> "$GITHUB_OUTPUT"
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Keep Agent disabled during compatibility bootstrap
        if: >-
          inputs.force_agent_protocol_bootstrap == true ||
          steps.file-activity-rollout.outputs.compatibility_deploy == 'true'
        run: |
          for name in \
            AGENT_ASSET_UPLOAD_ENABLED \
            AGENT_RUNS_ENABLED \
            AGENT_VISION_ENABLED \
            AGENT_WRITES_ENABLED; do
            if [ "${!name}" != "0" ]; then
              printf '%s must be 0 during a compatibility bootstrap\n' \
                "$name" >&2
              exit 1
            fi
          done

      - name: Deploy API Worker for file activity compatibility
        if: steps.file-activity-rollout.outputs.compatibility_deploy == 'true'
        run: |
          umask 077
          api_secrets="$(mktemp)"
          trap 'rm -f "$api_secrets"' EXIT
          SECRETS_FILE="$api_secrets" bun -e '
            const keys = [
              "BETTER_AUTH_SECRET",
              "GITHUB_CLIENT_ID",
              "GITHUB_CLIENT_SECRET",
              "SENTRY_DSN",
              "TURSO_AUTH_TOKEN",
              "TURSO_DATABASE_URL",
            ]
            await Bun.write(
              process.env.SECRETS_FILE,
              JSON.stringify(Object.fromEntries(keys.map((key) => [key, process.env[key]])))
            )
          '
          api_config="apps/api/wrangler.jsonc"
          if [ "${{ steps.worker-state.outputs.bootstrap_required }}" = "true" ]; then
            api_config="apps/api/wrangler.bootstrap.jsonc"
          fi
          apps/api/node_modules/.bin/wrangler deploy \
            apps/api/dist/worker/worker.js \
            --config "$api_config" \
            --no-bundle \
            --var "AGENT_ASSET_UPLOAD_ENABLED:$AGENT_ASSET_UPLOAD_ENABLED" \
            --var "SENTRY_ENVIRONMENT:$SENTRY_ENVIRONMENT" \
            --var "SENTRY_RELEASE:$SENTRY_RELEASE" \
            --domain "$API_HOST" \
            --strict \
            --secrets-file "$api_secrets"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_API_DSN }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Smoke API Worker before file activity migration
        if: steps.file-activity-rollout.outputs.compatibility_deploy == 'true'
        run: |
          assert_status() {
            label="$1"
            expected="$2"
            url="$3"
            status=""
            for delay in 0 2 4 8 12; do
              sleep "$delay"
              status="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$status" = "$expected" ]; then
                printf '%s smoke passed\n' "$label"
                return 0
              fi
            done
            printf '%s smoke failed with HTTP %s\n' "$label" "$status" >&2
            return 1
          }
          assert_status API-compat-health 200 "$API_PUBLIC_URL/health"
          assert_status API-compat-ready 200 "$API_PUBLIC_URL/ready"
          assert_status API-compat-OpenAPI 200 "$API_PUBLIC_URL/openapi/json"

      - name: Apply Turso migrations
        run: bun run --cwd packages/db db:migrate
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Bootstrap API Worker for mutual Service Bindings
        if: >-
          steps.file-activity-rollout.outputs.compatibility_deploy != 'true' &&
          steps.worker-state.outputs.bootstrap_required == 'true'
        run: |
          umask 077
          api_secrets="$(mktemp)"
          trap 'rm -f "$api_secrets"' EXIT
          SECRETS_FILE="$api_secrets" bun -e '
            const keys = [
              "BETTER_AUTH_SECRET",
              "GITHUB_CLIENT_ID",
              "GITHUB_CLIENT_SECRET",
              "SENTRY_DSN",
              "TURSO_AUTH_TOKEN",
              "TURSO_DATABASE_URL",
            ]
            await Bun.write(
              process.env.SECRETS_FILE,
              JSON.stringify(Object.fromEntries(keys.map((key) => [key, process.env[key]])))
            )
          '
          apps/api/node_modules/.bin/wrangler deploy \
            apps/api/dist/worker/worker.js \
            --config apps/api/wrangler.bootstrap.jsonc \
            --no-bundle \
            --var "AGENT_ASSET_UPLOAD_ENABLED:$AGENT_ASSET_UPLOAD_ENABLED" \
            --var "SENTRY_ENVIRONMENT:$SENTRY_ENVIRONMENT" \
            --var "SENTRY_RELEASE:$SENTRY_RELEASE" \
            --domain "$API_HOST" \
            --strict \
            --secrets-file "$api_secrets"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_API_DSN }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Build Agent Worker and upload source maps
        run: |
          bun run --cwd apps/agent build:cloudflare
          apps/api/node_modules/.bin/sentry-cli sourcemaps inject apps/agent/dist/worker
          apps/api/node_modules/.bin/sentry-cli sourcemaps upload \
            --release "$SENTRY_RELEASE" \
            --validate \
            --strict \
            --wait \
            apps/agent/dist/worker
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ env.SENTRY_AGENT_PROJECT }}

      - name: Deploy Agent Worker
        run: |
          umask 077
          agent_secrets="$(mktemp)"
          trap 'rm -f "$agent_secrets"' EXIT
          SECRETS_FILE="$agent_secrets" bun -e '
            const keys = ["OPENROUTER_API_KEY", "SENTRY_DSN"]
            await Bun.write(
              process.env.SECRETS_FILE,
              JSON.stringify(Object.fromEntries(keys.map((key) => [key, process.env[key]])))
            )
          '
          bun run --cwd apps/agent deploy -- \
            ./dist/worker/worker.js \
            --no-bundle \
            --var "AGENT_RUNS_ENABLED:$AGENT_RUNS_ENABLED" \
            --var "AGENT_VISION_ENABLED:$AGENT_VISION_ENABLED" \
            --var "AGENT_WRITES_ENABLED:$AGENT_WRITES_ENABLED" \
            --var "NODE_ENV:production" \
            --var "SENTRY_ENVIRONMENT:production" \
            --var "SENTRY_RELEASE:$SENTRY_RELEASE" \
            --strict \
            --secrets-file "$agent_secrets"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_AGENT_DSN }}

      - name: Deploy final API Worker
        run: |
          umask 077
          api_secrets="$(mktemp)"
          trap 'rm -f "$api_secrets"' EXIT
          SECRETS_FILE="$api_secrets" bun -e '
            const keys = [
              "BETTER_AUTH_SECRET",
              "GITHUB_CLIENT_ID",
              "GITHUB_CLIENT_SECRET",
              "SENTRY_DSN",
              "TURSO_AUTH_TOKEN",
              "TURSO_DATABASE_URL",
            ]
            await Bun.write(
              process.env.SECRETS_FILE,
              JSON.stringify(Object.fromEntries(keys.map((key) => [key, process.env[key]])))
            )
          '
          apps/api/node_modules/.bin/wrangler deploy \
            apps/api/dist/worker/worker.js \
            --config apps/api/wrangler.jsonc \
            --no-bundle \
            --var "AGENT_ASSET_UPLOAD_ENABLED:$AGENT_ASSET_UPLOAD_ENABLED" \
            --var "SENTRY_ENVIRONMENT:$SENTRY_ENVIRONMENT" \
            --var "SENTRY_RELEASE:$SENTRY_RELEASE" \
            --domain "$API_HOST" \
            --strict \
            --secrets-file "$api_secrets"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_API_DSN }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Smoke API Worker
        run: |
          assert_status() {
            label="$1"
            expected="$2"
            url="$3"
            status=""
            for delay in 0 2 4 8 12; do
              sleep "$delay"
              status="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$status" = "$expected" ]; then
                printf '%s smoke passed\n' "$label"
                return 0
              fi
            done
            printf '%s smoke failed with HTTP %s\n' "$label" "$status" >&2
            return 1
          }
          assert_status API-health 200 "$API_PUBLIC_URL/health"
          assert_status API-ready 200 "$API_PUBLIC_URL/ready"
          assert_status API-OpenAPI 200 "$API_PUBLIC_URL/openapi/json"

      - name: Build Web Worker and upload source maps
        run: |
          bun run --cwd apps/web build:cloudflare
          OPEN_NEXT_DEPLOY=true apps/web/node_modules/.bin/wrangler deploy \
            --config apps/web/wrangler.jsonc \
            --dry-run \
            --outdir "$RUNNER_TEMP/web-worker" \
            --var "SENTRY_ENVIRONMENT:$SENTRY_ENVIRONMENT" \
            --var "SENTRY_RELEASE:$SENTRY_RELEASE"
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_WEB_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_WEB_DSN }}
          SENTRY_PROJECT: ${{ env.SENTRY_WEB_PROJECT }}

      - name: Deploy Web Worker
        run: |
          umask 077
          web_secrets="$(mktemp)"
          trap 'rm -f "$web_secrets"' EXIT
          SECRETS_FILE="$web_secrets" bun -e '
            const keys = ["SENTRY_DSN"]
            await Bun.write(
              process.env.SECRETS_FILE,
              JSON.stringify(Object.fromEntries(keys.map((key) => [key, process.env[key]])))
            )
          '
          bun run --cwd apps/web deploy -- \
            --var "SENTRY_ENVIRONMENT:$SENTRY_ENVIRONMENT" \
            --var "SENTRY_RELEASE:$SENTRY_RELEASE" \
            --domain "$APP_HOST" \
            --strict \
            --secrets-file "$web_secrets"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_WEB_DSN }}

      - name: Smoke Web Worker
        run: |
          assert_status() {
            label="$1"
            expected="$2"
            url="$3"
            status=""
            for delay in 0 2 4 8 12; do
              sleep "$delay"
              status="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$status" = "$expected" ]; then
                printf '%s smoke passed\n' "$label"
                return 0
              fi
            done
            printf '%s smoke failed with HTTP %s\n' "$label" "$status" >&2
            return 1
          }
          assert_status Web-sign-in 200 "$APP_BASE_URL/auth/sign-in"
