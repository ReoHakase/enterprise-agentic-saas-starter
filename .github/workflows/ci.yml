name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_NAME: Enterprise Agentic SaaS
  APP_BASE_URL: https://app.example.test
  API_PUBLIC_URL: https://api.example.test
  NEXT_PUBLIC_API_BASE_URL: https://api.example.test
  BETTER_AUTH_URL: https://api.example.test
  BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
  AUTH_COOKIE_DOMAIN: example.test
  TRUSTED_ORIGINS: https://app.example.test
  CORS_ORIGIN: https://app.example.test
  GITHUB_CLIENT_ID: ci-github-client
  GITHUB_CLIENT_SECRET: ci-github-secret
  TURSO_DATABASE_URL: file:/tmp/enterprise-agentic-saas-ci.db
  EMAIL_PROVIDER: noop
  EMAIL_FROM: noreply@example.com

jobs:
  nix:
    name: Nix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Flake check
        run: nix flake check

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Check formatting
        run: bun run format:check

      - name: Run lint, dead-code, and duplicate gates
        run: bun run check:static

      - name: Check migration history and schema drift
        run: bun run --cwd packages/db db:check

  quality-checks:
    name: Quality · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            command: bun run typecheck
            node_env: test
            coverage: false
          - name: Unit and integration tests
            command: bun run test
            node_env: test
            coverage: true
          - name: Application builds
            command: bun run build
            node_env: production
            coverage: false

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          NODE_ENV: ${{ matrix.node_env }}

      - name: Upload Vitest coverage
        if: ${{ matrix.coverage && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: Quality
    if: ${{ always() }}
    needs:
      - quality-checks
      - static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify quality lanes
        env:
          QUALITY_CHECKS: ${{ needs.quality-checks.result }}
          STATIC_ANALYSIS: ${{ needs.static-analysis.result }}
        run: |
          test "$STATIC_ANALYSIS" = success
          test "$QUALITY_CHECKS" = success

  browser-web-component-tests:
    name: Browser · Web components · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Storybook light
            script: test:browser:storybook:light
            artifact: storybook-light
          - name: Storybook dark
            script: test:browser:storybook:dark
            artifact: storybook-dark
          - name: Browser Mode
            script: test:browser:mode
            artifact: browser-mode

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: bun run --cwd apps/web ${{ matrix.script }}

      - name: Upload Web component failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-web-component-${{ matrix.artifact }}-failures
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-web-storybook-build:
    name: Browser · Web components · Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Build Web Storybook
        run: bun run --cwd apps/web build:storybook

      - name: Upload Web Storybook
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-web-static
          path: apps/web/storybook-static
          if-no-files-found: warn
          retention-days: 7

  browser-web-components:
    name: Browser · Web components
    if: ${{ always() }}
    needs:
      - browser-web-component-tests
      - browser-web-storybook-build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify Web component lanes
        env:
          STORYBOOK_BUILD: ${{ needs.browser-web-storybook-build.result }}
          WEB_COMPONENT_TESTS: ${{ needs.browser-web-component-tests.result }}
        run: |
          test "$WEB_COMPONENT_TESTS" = success
          test "$STORYBOOK_BUILD" = success

  browser-ui-components:
    name: Browser · UI components
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Install Chromium
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium

      - name: Run UI Storybook tests
        run: bun run --cwd packages/ui test:browser

      - name: Build UI Storybook
        run: bun run --cwd packages/ui build:storybook

      - name: Upload UI Storybook
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-ui-static
          path: packages/ui/storybook-static
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI component failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-ui-component-failures
          path: packages/ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-nextjs-integration:
    name: Browser · Next.js integration
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Install Chromium and WebKit
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium webkit

      - name: Build Next.js integration application
        run: bun run --cwd apps/web build:test:browser:app

      - name: Run Next.js integration in Chromium
        run: bun run --cwd apps/web test:browser:app:chromium

      - name: Run representative Next.js integration in WebKit
        run: bun run --cwd apps/web test:browser:app:webkit

      - name: Upload Next.js integration failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-nextjs-integration-failures
          path: |
            apps/web/playwright-report/app-integration
            apps/web/test-results/app-integration
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser
    if: ${{ always() }}
    needs:
      - browser-web-components
      - browser-ui-components
      - browser-nextjs-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify browser lanes
        env:
          UI_COMPONENTS: ${{ needs.browser-ui-components.result }}
          NEXTJS_INTEGRATION: ${{ needs.browser-nextjs-integration.result }}
          WEB_COMPONENTS: ${{ needs.browser-web-components.result }}
        run: |
          test "$WEB_COMPONENTS" = success
          test "$UI_COMPONENTS" = success
          test "$NEXTJS_INTEGRATION" = success

  free-e2e:
    name: Free E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: ./.github/actions/setup-bun

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Run the full free E2E suite
        run: >-
          nix develop --command env -u NO_COLOR
          bun run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-free-e2e
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

  cloudflare-dry-run:
    name: Cloudflare dry-run · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            package: "@enterprise-agentic-saas/web"
          - name: API
            package: "@enterprise-agentic-saas/api"
          - name: Agent
            package: "@enterprise-agentic-saas/agent"

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Build Worker without deploying
        run: bunx turbo run build:cloudflare --filter="${{ matrix.package }}"
        env:
          NODE_ENV: production
