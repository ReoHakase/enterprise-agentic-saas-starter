name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_NAME: Enterprise Agentic SaaS
  APP_BASE_URL: https://app.example.test
  API_PUBLIC_URL: https://api.example.test
  NEXT_PUBLIC_API_BASE_URL: https://api.example.test
  NEXT_PUBLIC_AGENT_BASE_URL: https://agent.example.test
  BETTER_AUTH_URL: https://api.example.test
  BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
  AUTH_COOKIE_DOMAIN: example.test
  TRUSTED_ORIGINS: https://app.example.test
  CORS_ORIGIN: https://app.example.test
  GITHUB_CLIENT_ID: ci-github-client
  GITHUB_CLIENT_SECRET: ci-github-secret
  TURSO_DATABASE_URL: file:/tmp/enterprise-agentic-saas-ci.db
  EMAIL_PROVIDER: noop
  EMAIL_FROM: noreply@example.com

jobs:
  nix:
    name: Nix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Flake check
        run: nix flake check

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration history
        run: bun run --cwd packages/db db:check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test

      - name: Upload Vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: error

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

  storybook:
    name: Storybook a11y and interactions
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build Storybook
        run: bun run build:storybook

      - name: Test stories in light and dark mode
        run: bun run test:storybook

      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          if-no-files-found: error

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit

      - name: Run browser smoke tests
        run: bun run test:e2e
        env:
          NODE_ENV: development

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: error

  cloudflare:
    name: Cloudflare dry run
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Workers without deploying
        run: bun run build:cloudflare
        env:
          NODE_ENV: production
