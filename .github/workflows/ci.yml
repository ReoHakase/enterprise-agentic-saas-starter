name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_NAME: Enterprise Agentic SaaS
  APP_BASE_URL: https://app.example.test
  API_PUBLIC_URL: https://api.example.test
  NEXT_PUBLIC_API_BASE_URL: https://api.example.test
  BETTER_AUTH_URL: https://api.example.test
  BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
  AUTH_COOKIE_DOMAIN: example.test
  TRUSTED_ORIGINS: https://app.example.test
  CORS_ORIGIN: https://app.example.test
  GITHUB_CLIENT_ID: ci-github-client
  GITHUB_CLIENT_SECRET: ci-github-secret
  TURSO_DATABASE_URL: file:/tmp/enterprise-agentic-saas-ci.db
  EMAIL_PROVIDER: noop
  EMAIL_FROM: noreply@example.com

jobs:
  nix:
    name: Nix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Flake check
        run: nix flake check

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun

      - name: Run static checks in parallel
        shell: bash
        run: |
          set -u

          bun run --cwd packages/db db:check & db_check_pid=$!
          bun run lint & lint_pid=$!
          bun run format:check & format_check_pid=$!

          failures=0
          for pid in "$db_check_pid" "$lint_pid" "$format_check_pid"; do
            if ! wait "$pid"; then
              failures=1
            fi
          done

          exit "$failures"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun run typecheck

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun

      - name: Run tests
        run: bun run test

      - name: Upload Vitest coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            package: "@enterprise-agentic-saas/web"
          - name: API
            package: "@enterprise-agentic-saas/api"

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: Build
        run: bunx turbo run build --filter="${{ matrix.package }}"
        env:
          NODE_ENV: production

  storybook-build:
    name: Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun run build:storybook

      - name: Upload Storybook
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          if-no-files-found: warn
          retention-days: 7

  storybook-test:
    name: Storybook browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test stories in light and dark mode
        run: bun run test:storybook

  e2e:
    name: E2E · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Desktop Chrome
            id: desktop-chrome
            browser: chromium
            command: env -u NO_COLOR bunx playwright test --project=desktop-chrome
          - name: Pixel 7 Chrome
            id: pixel-7-chrome
            browser: chromium
            command: env -u NO_COLOR bunx playwright test --project=pixel-7-chrome
          - name: iPhone 13 WebKit
            id: iphone-13-webkit
            browser: webkit
            command: env -u NO_COLOR bunx playwright test --project=iphone-13-webkit
          - name: GitHub OAuth
            id: github-oauth
            browser: chromium
            command: env -u NO_COLOR bunx playwright test --config=playwright.oauth.config.ts

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: Install browser
        run: bunx playwright install --with-deps "${{ matrix.browser }}"
      - name: Run E2E
        working-directory: apps/web
        run: ${{ matrix.command }}
        env:
          NODE_ENV: development

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

  cloudflare:
    name: Cloudflare · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            package: "@enterprise-agentic-saas/web"
          - name: API
            package: "@enterprise-agentic-saas/api"
          - name: Agent
            package: "@enterprise-agentic-saas/agent"

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: Build Worker without deploying
        run: bunx turbo run build:cloudflare --filter="${{ matrix.package }}"
        env:
          NODE_ENV: production
