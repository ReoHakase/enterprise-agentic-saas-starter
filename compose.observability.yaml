name: enterprise-agentic-saas-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.27.1
    container_name: enterprise-agentic-saas-observability
    restart: unless-stopped
    environment:
      LOKI_EXTRA_ARGS: >-
        --compactor.retention-enabled=true
        --compactor.delete-request-store=filesystem
        --store.retention=168h
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - enterprise-agentic-saas-observability-data:/data
      - ./otelcol.observability.yaml:/otel-lgtm/otelcol-config.yaml:ro

volumes:
  enterprise-agentic-saas-observability-data:
    name: enterprise-agentic-saas-observability-data
