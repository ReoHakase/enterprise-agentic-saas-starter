commit-msg:
  commands:
    commitlint:
      run: bun commitlint --edit {1}

pre-commit:
  commands:
    nix-flake-check:
      glob: "{flake.nix,flake.lock}"
      run: nix flake check
    oxfmt:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bun run format -- {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: bun run lint

pre-push:
  commands:
    check:
      run: bun run check
