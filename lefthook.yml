commit-msg:
  commands:
    commitlint:
      run: bun commitlint --edit {1}

pre-commit:
  commands:
    nix-flake-check:
      glob: "{flake.nix,flake.lock}"
      run: nix flake check
    oxfmt:
      glob: "*"
      run: bun run format -- --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    vitest-related:
      glob: "*"
      run: bun scripts/test-related.ts {staged_files}
    oxlint:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: bun run lint

pre-push:
  commands:
    check:
      run: bun run check
